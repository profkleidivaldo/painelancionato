<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel do Ancião">
<meta name="theme-color" content="#1b3a5c">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Painel do Ancião">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Painel do Ancião</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<style>
/* Layout: faixa azul no topo, calendário mensal à esquerda (quartas em azul, sábados em dourado), painel lateral com três cartões à direita. */
:root{
  --bg:#edf2f7; --surface:#ffffff; --surface2:#f3f6fa; --fg:#13253a; --muted:#5a6b7d; --line:#d6dfe8;
  --band:#1b3a5c; --band-fg:#ffffff; --title:#1b3a5c;
  --card-head:#bfe5e8; --card-head-fg:#103846;
  --blue:#3d85d4; --gold:#cf9519; --sun:#c0463d; --today:#1b3a5c; --today-fg:#ffffff;
  --btn:#1b3a5c; --btn-fg:#ffffff; --danger:#b02a23; --ok:#1f7a4d;
  --shadow:0 1px 2px rgba(19,37,58,.08),0 4px 14px rgba(19,37,58,.06);
  --font-head:Montserrat,Inter,system-ui,sans-serif;
  --font-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1520; --surface:#152130; --surface2:#1b2b3e; --fg:#e5edf6; --muted:#9bb0c4; --line:#293c51;
    --band:#0a2038; --title:#cfe3f8;
    --card-head:#17424b; --card-head-fg:#d4f1f3;
    --blue:#4b95e6; --gold:#e0a82c; --sun:#ea7f76; --today:#cfe3f8; --today-fg:#0a2038;
    --btn:#4b95e6; --btn-fg:#06182b; --danger:#f28b82; --ok:#7fd39b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.ic{display:block;flex:none}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(var(--band) 0 220px,var(--bg) 220px)}
.login-card{width:100%;max-width:400px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:28px 24px;display:grid;gap:14px}
.login-card .lock{width:44px;height:44px;border-radius:12px;background:var(--card-head);color:var(--card-head-fg);display:grid;place-items:center}
.login-card h1{font:800 20px/1.25 var(--font-head);color:var(--title);text-transform:uppercase;letter-spacing:.02em}
.login-card label,.form label,.lbl{display:block;margin-bottom:4px;font-size:13px;font-weight:500;color:var(--muted)}
.erro{color:var(--danger);font-size:14px}
.demo{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:10px 12px}
.check,.form label.check,.login-card label.check{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:500;color:var(--fg)}
.check input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--blue)}

/* ---------- Controles ---------- */
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],input[type=search],input[type=tel],select,textarea{
  width:100%;padding:9px 11px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:9px;min-height:40px}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled,input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.ibtn.flat{border-color:transparent;background:transparent}

/* ---------- Faixa superior ---------- */
.band{background:var(--band);color:var(--band-fg)}
.band-in{max-width:1280px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 18px max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.band h1{flex:1 1 280px;font:800 clamp(20px,3.2vw,34px)/1.1 var(--font-head);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who .sync{opacity:.8;cursor:pointer;background:none;border:0;color:inherit;padding:4px 6px;border-radius:6px}
.who .nome{font-weight:600}
.band .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff;min-height:34px;padding:4px 12px;font-size:13px}

/* ---------- Estrutura ---------- */
.page{max-width:1280px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.mtop{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.mes{flex:1 1 240px;font:800 clamp(26px,4.2vw,40px)/1.1 var(--font-head);color:var(--title);text-transform:uppercase}
.nav{display:flex;gap:8px;align-items:center}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tools .busca{flex:1 1 200px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;min-height:40px;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--btn-fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.lg{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 14%,var(--surface));font-size:12.5px;font-weight:500;cursor:pointer}
.lg .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.lg.on{box-shadow:0 0 0 2px var(--c);font-weight:600}
.lg.off{opacity:.5;background:var(--surface)}
.fbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:var(--muted)}

/* ---------- Calendário ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow{padding:9px 4px;text-align:center;background:var(--surface);font:700 12px var(--font-head);color:var(--muted);letter-spacing:.05em}
.dow.d0{background:var(--sun);color:#fff}
.dow.d3{background:var(--blue);color:#fff}
.dow.d6{background:var(--gold);color:#fff}
.dow .abbr{display:none}
.cell{min-height:118px;padding:6px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;text-align:left}
.cell.d0{background:color-mix(in srgb,var(--sun) 11%,var(--surface))}
.cell.d3{background:color-mix(in srgb,var(--blue) 12%,var(--surface))}
.cell.d6{background:color-mix(in srgb,var(--gold) 15%,var(--surface))}
.cell.out{opacity:.5}
.cell:hover{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--blue) 55%,transparent)}
.num{align-self:flex-start;min-width:24px;height:24px;padding:0 4px;display:grid;place-items:center;font:700 13px var(--font-head);color:var(--muted);border-radius:99px}
.hoje .num{background:var(--today);color:var(--today-fg)}
.evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{display:flex;align-items:center;gap:5px;width:100%;text-align:left;padding:4px 6px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 17%,var(--surface));cursor:pointer;min-width:0}
.chip .ct{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.chip b{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip i{font-style:normal;font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{color:var(--c)}
.chip.pend{border-style:dashed}
.mais{font-size:11px;color:var(--muted);font-weight:600;padding-left:4px}

/* ---------- Lista ---------- */
.dia-grupo{margin-bottom:16px}
.dia-grupo h3{font:700 14px var(--font-head);color:var(--title);margin-bottom:8px}
.dia-grupo h3::first-letter{text-transform:uppercase}
.agenda{display:none;margin-top:20px}
.agenda>h3{font:700 16px var(--font-head);color:var(--title);margin-bottom:12px}
.ver{display:grid;gap:12px}
.ver-card{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ver-card:last-of-type{border-bottom:0;padding-bottom:0}
.ver-h{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.ver-h .ico{width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--c) 24%,var(--surface));color:var(--c);display:grid;place-items:center;flex:none}
.ver-h b{display:block;font:700 16px var(--font-head);overflow-wrap:anywhere}
.ver-h span{font-size:13px;color:var(--muted)}
.ver dl{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:6px 14px;margin:0;font-size:14px}
.ver dt{color:var(--muted)}
.ver dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 11%,var(--surface));margin-bottom:6px}
.item .ico{width:34px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--c);display:grid;place-items:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .tx span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tag{flex:none;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.tag.pend{background:color-mix(in srgb,var(--gold) 20%,var(--surface));color:var(--fg)}
.vazio{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- Painel lateral ---------- */
.side{display:grid;gap:16px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--card-head);color:var(--card-head-fg);font:700 15px var(--font-head)}
.card-h .sp{flex:1}
.card-h .ibtn{width:30px;height:30px;background:transparent;border-color:transparent;color:inherit}
.card-b{padding:14px;display:grid;gap:12px}
.vis{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;align-items:center}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;grid-row:span 2}
.ck.on{background:var(--ok);border-color:var(--ok)}
.vis .nm{font-weight:600;font-size:14px}
.vis .qt{font-size:12.5px;color:var(--muted);text-align:right}
.bar{grid-column:2/4;height:7px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--blue);border-radius:99px}
.vis.cheio .bar span{background:var(--ok)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{border:0;border-radius:99px;padding:5px 12px;background:var(--c);color:#fff;font-weight:600;font-size:12.5px;cursor:pointer}
.badge.off{opacity:.4}
.sub{font:700 13px var(--font-head);color:var(--title)}
.tk{display:flex;align-items:flex-start;gap:10px;font-size:14px}
.tk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.tk .t{flex:1;min-width:0;overflow-wrap:anywhere}
.tk small{display:block;color:var(--muted);font-size:12px}
.tk .dp{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:7px;flex:none}
.late{color:var(--danger);font-weight:600}
.lst{display:grid;gap:6px;font-size:14px}
.lst .ln{display:flex;gap:8px;align-items:baseline}
.lst .ln b{font-weight:600;white-space:nowrap}
.lst .ln span{min-width:0;overflow-wrap:anywhere}
.alerta{background:color-mix(in srgb,var(--gold) 16%,var(--surface));border-radius:10px;padding:10px 12px;font-size:13.5px}
.alerta .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rodape{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--muted);font-size:13px}

/* ---------- Janela ---------- */
dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:0;border:0;border-radius:16px;background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,18,30,.55)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--band);color:var(--band-fg)}
.dlg-h h2{flex:1;font:700 16px var(--font-head)}
.dlg-h h2::first-letter{text-transform:uppercase}
.dlg-h .ibtn{background:transparent;border-color:rgba(255,255,255,.3);color:#fff;width:34px;height:34px}
.dlg-b{padding:16px;overflow:auto;max-height:calc(100vh - 100px);display:grid;gap:12px}
.form{display:grid;gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--blue)}
.row2{display:grid;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.row2 .top{display:flex;gap:8px;align-items:center}
.row2 .top b{flex:1;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 16px;background:var(--fg);color:var(--bg);border-radius:9px;font-size:14px;z-index:50}

/* ---------- Recursos adicionais ---------- */
body.leitor .so-editor{display:none!important}
body.leitor dialog form:not(.keep){display:none}
.sino{position:relative;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.sino .n{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--sun);color:#fff;font:700 11px var(--font-body);display:grid;place-items:center}
.tools2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tools2 .btn{justify-content:flex-start;text-align:left}
.semana{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--sun) 10%,var(--surface));font-size:13.5px}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:14px}
.al i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--blue)}
.al.warn i{background:var(--gold)}
.al.bad i{background:var(--sun)}
.al span{min-width:0;overflow-wrap:anywhere}
.ranks{display:flex;flex-wrap:wrap;gap:6px}
.chips{gap:6px}
.top-st{display:grid;gap:2px}
input.mus{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
input[readonly],textarea[readonly]{opacity:.85}
.row2 a.btn{text-decoration:none}
.sec-t{margin:6px 0 0;font:700 14px var(--font-head);color:var(--title)}
.deps{display:grid;gap:5px;max-height:290px;overflow:auto;padding-right:2px}
.dep{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.dep .dp{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:6px;flex:none}
.dep .tx{min-width:0}
.dep b{display:block;font-size:13.5px;font-weight:600}
.dep small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.dep[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.dep.off{opacity:.45}
.tel a{margin-left:8px;font-weight:600;color:var(--blue)}
.telbox{display:grid;gap:6px;margin-top:6px}
details.dd{border:1px solid var(--line);border-radius:10px}
details.dd>summary{padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
details.dd .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
details.dd .resumo{font-weight:400;font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
details.dd .dd-b{padding:0 12px 12px;display:grid;gap:10px}
.apoio{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.row2 .top .ibtn{width:34px;height:34px;flex:none}
/* ---------- Telas estreitas ---------- */
@media (max-width:1020px){.shell{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  .panel{padding:12px}
  .dow .full{display:none}.dow .abbr{display:inline}
  .cell{min-height:62px;padding:4px;align-items:center}
  .evs{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px}
  .chip{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:var(--c);pointer-events:none}
  .chip .ct,.chip svg{display:none}
  .chip.pend{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
  .mais{display:none}
  .num{align-self:center}
  .agenda{display:block}
  .item{flex-wrap:wrap}
  .item .tx{flex:1 1 150px}
  .ver dl{grid-template-columns:1fr;gap:2px}
  .ver dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:no-preference){.cell,.chip,.btn{transition:box-shadow .12s,background-color .12s}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="lock" id="lg-ico"></div>
    <h1 id="lg-titulo"></h1>
    <p class="muted">Acesso restrito aos anciãos. Entre com seu nome e senha.</p>
    <form id="f-login" class="form" autocomplete="on">
      <div><label for="lg-nome">Nome</label><input type="text" id="lg-nome" autocomplete="username" required></div>
      <div><label for="lg-senha">Senha</label><input type="password" id="lg-senha" autocomplete="current-password" required></div>
      <label class="check"><input type="checkbox" id="lg-manter" checked> Manter conectado neste aparelho</label>
      <p id="lg-erro" class="erro" role="alert" hidden></p>
      <button class="btn primary block" type="submit" id="lg-btn">Entrar</button>
    </form>

const $ = s => document.querySelector(s);
function h(tag,props,...kids){
  const el=document.createElement(tag), after={};
  Object.keys(props||{}).forEach(k=>{
    const v=props[k];
    if(v==null||v===false)return;
    if(k==='class')el.className=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled')after[k]=v;
    else el.setAttribute(k,v===true?'':v);
  });
  (function add(list){list.forEach(kid=>{
    if(kid==null||kid===false)return;
    if(Array.isArray(kid))return add(kid);
    el.append(kid.nodeType?kid:document.createTextNode(String(kid)));
  });})(kids);
  if('value' in after)el.value=after.value;
  if('checked' in after)el.checked=!!after.checked;
  if('disabled' in after)el.disabled=!!after.disabled;
  return el;
}

function erroRede(msg){const e=new Error(msg||'Sem conexão com o servidor.');e.rede=true;return e;}
async function chamar(action,dados){
  if(navigator.onLine===false)throw erroRede();
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),30000);
  try{
    const r=await fetch(CONFIG.API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // evita pré-verificação CORS
      body:JSON.stringify(Object.assign({action:action,token:S.token},dados||{})),
      signal:ctrl.signal
    });
    const j=await r.json();
    if(j.auth===false&&action!=='login'){sair('Sua sessão expirou. Entre novamente.');const e=new Error(j.erro||'Sessão expirada.');e.auth=true;throw e;}
    if(!j.ok){
      const m=j.erro||'Erro no servidor.';
      if(/^(Configuração inválida|Entidade inválida|Valor inválido em|Configuração desconhecida)/.test(m))
        throw new Error('O servidor está com uma versão antiga do Code.gs. Cole o código novo no Apps Script e publique uma Nova versão da implantação.');
      throw new Error(m);
    }
    return j;
  }catch(e){
    if(e.name==='AbortError')throw erroRede('O servidor demorou para responder.');
    if(e instanceof TypeError)throw erroRede();
    throw e;
  }finally{clearTimeout(t);}
}
/* Fila de alterações feitas sem internet: guardada no aparelho e enviada em ordem quando a conexão volta. */
const FILA_KEY='painel_fila',CACHE_KEY='painel_cache';
function lerFila(){try{return JSON.parse(localStorage.getItem(FILA_KEY)||'[]');}catch(_){return [];}}
function gravarFila(f){try{if(f.length)localStorage.setItem(FILA_KEY,JSON.stringify(f));else localStorage.removeItem(FILA_KEY);}catch(_){toast('A memória do aparelho está cheia. Conecte-se à internet para enviar as alterações.');}}
function enfileirar(action,dados){
  const f=lerFila();
  if(action==='config'){const i=f.findIndex(x=>x.action==='config'&&x.dados.chave===dados.chave);if(i>=0)f.splice(i,1);}
  const mesma=x=>x.dados&&x.dados.tipo===dados.tipo&&x.dados.data===dados.data;
  if(action==='litSalvar'){for(let i=f.length-1;i>=0;i--)if(f[i].action==='litSalvar'&&mesma(f[i]))f.splice(i,1);}   // só a última versão da liturgia precisa ir
  if(action==='litMusica'){
    let i=-1;for(let j=f.length-1;j>=0;j--){if(f[j].action==='litExcluir'&&mesma(f[j]))break;if(f[j].action==='litMusica'&&mesma(f[j])){i=j;break;}}
    if(i>=0){const d0=f[i].dados.delta=f[i].dados.delta||{m:{}};d0.m=Object.assign({},d0.m,dados.delta.m);if(dados.delta.v!==undefined)d0.v=dados.delta.v;gravarFila(f);setSync(navigator.onLine===false?'Offline':'Aguardando envio');return;}
  }
  f.push({action:action,dados:dados});gravarFila(f);
  setSync(navigator.onLine===false?'Offline':'Aguardando envio');
}
function respostaOffline(action,dados){
  if(action!=='salvar')return {ok:true,offline:true};

}
let enviando=false;
async function esvaziarFila(){
  if(enviando||!S.token||!lerFila().length)return;
  enviando=true;
  try{
    let f=lerFila();

async function api(action,dados){
  if(!CONFIG.API_URL)return demoApi(action,dados||{});
  const escrita=ESCRITAS.indexOf(action)>=0;
  if(escrita&&lerFila().length){   // já há coisas na fila: mantém a ordem
    enfileirar(action,dados);esvaziarFila().then(()=>{setSync(lerFila().length?'Aguardando envio':'Enviado');});
    return respostaOffline(action,dados);
  }
  try{return await chamar(action,dados);}
  catch(e){
    if(escrita&&e.rede){
      enfileirar(action,dados);
      setTimeout(()=>toast('Sem internet: salvo neste aparelho. Será enviado quando a conexão voltar.'),700);
      return respostaOffline(action,dados);
    }
    throw e;
  }
}

function norm(r){
  S.eventos=(r.eventos||[]).slice();
  S.tarefas=(r.tarefas||[]).map(t=>Object.assign({},t,{feito:t.feito===true||t.feito==='true'}));
  S.pessoas=(r.pessoas||[]).slice();

  S.metas=Object.assign({},META_PADRAO,c.metasVisitas||{});
  S.catsVisita=(Array.isArray(c.categoriasVisita)&&c.categoriasVisita.length?c.categoriasVisita:CATS_VISITA.map(k=>({id:k[0],nome:k[1],meta:S.metas[k[0]]})))
    .map(k=>({id:String(k.id||novoId()),nome:String(k.nome||''),meta:Math.max(0,Number(k.meta)||0)}));
  S.rodizio=migraRodizio(c.rodizio);

  S.lits={};(r.liturgias||[]).forEach(x=>{if(x&&x.tipo&&x.data)S.lits[litKey(x.tipo,x.data)]=x;});
  S.deptos=(Array.isArray(c.deptos)&&c.deptos.length?c.deptos:DEPTOS_PADRAO.map(p=>({nome:p[0],cor:p[1]}))).map(normDepto);
  if(S.depto&&!S.deptos.some(d=>d.nome===S.depto))S.depto='';
  if(r.perfil&&r.perfil!==S.perfil){S.perfil=r.perfil;aplicaPerfil();}

async function carregar(silencioso){
  try{
    if(!silencioso)setSync('Sincronizando…');
    await esvaziarFila();
    if(!S.token)return;
    if(lerFila().length){setSync(navigator.onLine===false?'Offline':'Aguardando envio');return;}   // não sobrescreve o que ainda não foi enviado
    const r=await api('listar');
    norm(r);guardarCache(r);render();
    if(litAtual)litAtual.refresca();
    const n=new Date();setSync('Atualizado às '+pad(n.getHours())+':'+pad(n.getMinutes()));
  }catch(e){
    if(e.rede){setSync('Offline · usando dados salvos');return;}
    setSync('Falha ao sincronizar. Toque para tentar de novo.');if(!silencioso)toast(e.message);
  }

async function salvar(col,itens){
  if(!pode()){toast('Seu acesso é somente de leitura.');render();return false;}
  const antes=S[col].slice();
  itens.forEach(it=>{
    const i=S[col].findIndex(x=>x.id===it.id);
    if(i>=0)S[col][i]=Object.assign({},S[col][i],it);else S[col].push(Object.assign({criadoPor:S.usuario},it));
  });
  render();
  try{
    const r=await api('salvar',{entidade:col,itens:itens});
    (r.itens||[]).forEach(o=>{
      if(col==='tarefas')o.feito=o.feito===true||o.feito==='true';
      const i=S[col].findIndex(x=>x.id===o.id);if(i>=0)S[col][i]=o;
    });
    render();cacheLocal();return true;
  }catch(e){S[col]=antes;render();toast('Não foi possível salvar: '+e.message);return false;}
}
async function excluir(col,id){
  if(!pode()){toast('Seu acesso é somente de leitura.');return false;}
  const antes=S[col].slice();
  S[col]=S[col].filter(x=>x.id!==id);render();
  try{await api('excluir',{entidade:col,id:id});cacheLocal();return true;}
  catch(e){S[col]=antes;render();toast('Não foi possível excluir: '+e.message);return false;}
}

  if(S.depto&&ev.depto!==S.depto)return false;
  const q=S.busca.trim().toLowerCase();
  if(q){
    const txt=[ev.titulo,ev.pessoa,ev.dirigente,ev.detalhe,ev.depto,tipoDe(ev).nome].join(' ').toLowerCase();
    if(txt.indexOf(q)<0)return false;

function renderCalendario(){

  const ag=h('div',{class:'agenda'},h('h3',null,'Agenda de '+MESES[m]));

  const inDir=h('input',{type:'text',id:'e-dir',value:ev.dirigente,maxlength:'120',autocomplete:'off',list:'dl-anc'});
  const selCat=h('select',{id:'e-cat',value:ev.categoria},h('option',{value:''},'Escolha'),S.catsVisita.map(c=>h('option',{value:c.id},c.nome)));

  const wCat=h('div',null,h('label',{for:'e-cat'},'Categoria da visita'),selCat);
  const chkRep=h('input',{type:'checkbox',id:'e-rep'});
  const inAte=h('input',{type:'date',id:'e-ate'});
  const wRep=h('div',{class:'row2'},h('label',{class:'check',for:'e-rep'},chkRep,'Repetir toda semana'),h('div',{id:'e-ate-w',hidden:true},h('label',{for:'e-ate'},'Repetir até'),inAte));

    return d;
  }
  selDepto.addEventListener('change',()=>{
    const d=atualizaDep();
    if(d&&d.responsavel&&!inPessoa.value.trim()&&TIPOS[selTipo.value].pessoa!=='Pregador'&&selTipo.value!=='santa_ceia'){inPessoa.value=d.responsavel;atualizaTel();}

  inData.addEventListener('change',()=>{if(!dirManual&&inData.value)inDir.value=anciaoDaSemana(inData.value)||'';});

    selSt.replaceChildren(...ops.map(o=>h('option',{value:o[0]},o[1])));
    selSt.value=ops.some(o=>o[0]===stAtual)?stAtual:ops[0][0];

    h('div',null,lbPessoa,inPessoa,telBox),wDir,wCat,

    dicaDep,
    h('div',null,h('label',{for:'e-det'},'Tema, texto bíblico ou anotações'),inDet),

  form.addEventListener('submit',async e=>{
    e.preventDefault();

    const t=TIPOS[selTipo.value];
    const item={tipo:selTipo.value,titulo:inTitulo.value.trim(),data:inData.value,hora:inHora.value,pessoa:inPessoa.value.trim(),

      itens=[];const d=parse(item.data);
      while(isoOf(d)<=inAte.value&&itens.length<60){itens.push(Object.assign({id:novoId()},item,{data:isoOf(d)}));d.setDate(d.getDate()+7);}
    }else itens=[Object.assign({id:novoId()},item)];

      fechar();toast(itens.length>1?itens.length+' eventos criados':'Evento salvo');
    }else btnSalvar.disabled=false;
  });
  abrir(edit?'Editar evento':'Novo evento',form);
}
/* Guarda o telefone digitado no evento: atualiza quem já está no cadastro ou cria um pregador convidado. */
async function registrarContato(nome,tel,cadastrar){

  if(!p){if(cadastrar)await salvar('pessoas',[{id:novoId(),nome:nome,tipo:'convidado',telefone:tel,origem:'',obs:''}]);return;}
  if(!p.telefone&&tel)await salvar('pessoas',[{id:p.id||novoId(),nome:p.nome,tipo:p.tipo,telefone:tel,origem:p.origem||'',obs:p.obs||''}]);
}

/* =====================================================================
   RECURSOS ADICIONAIS
   ===================================================================== */
const nrm = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const casa = (campo,nome) => {const a=nrm(campo),b=nrm(nome);return !!a&&!!b&&(a.indexOf(b)>=0||b.indexOf(a)>=0);};
function somaDias(iso,n){const d=parse(iso);d.setDate(d.getDate()+n);return isoOf(d);}
/* A semana do ancião vai de sábado a sexta. */
function inicioSemana(iso){const d=parse(iso);d.setDate(d.getDate()-((d.getDay()+1)%7));return isoOf(d);}
function anciaoNaSemana(iso,r){
  if(!r||!r.semanas||!iso)return '';
  return r.semanas[inicioSemana(iso)]||'';
}
/* Converte o rodízio antigo (lista + data de início) em designações por semana, sem mudar quem estava escalado. */
function migraRodizio(r){
  r=r||{};
  if(r.semanas&&typeof r.semanas==='object')return {semanas:Object.assign({},r.semanas)};
  const sem={};
  if(Array.isArray(r.anciaos)&&r.anciaos.length&&r.inicio){
    const n=r.anciaos.length,i0=parse(inicioSemana(r.inicio)),hoje=inicioSemana(hojeIso());
    for(let i=-4;i<26;i++){const w=somaDias(hoje,i*7),k=Math.round((parse(w)-i0)/(7*864e5));sem[w]=r.anciaos[((k%n)+n)%n];}
  }
  return {semanas:sem};
}
function anciaoDaSemana(iso){return anciaoNaSemana(iso,S.rodizio);}
const mesmo = (a,b) => !!nrm(a)&&nrm(a)===nrm(b);
/* Chave para achar a pessoa mesmo com "Pr.", "Ancião" ou "Irmão" na frente do nome. */
const chavePessoa = s => nrm(s).replace(/^(anciao|pastor|pastora|pr|irmao|irma|dr|dra)\.?\s+/,'');
const deptoPorNome = n => S.deptos.find(d=>d.nome===n);

/* Anciãos = quem tem login (vem do servidor) + quem foi cadastrado em Anciãos e pregadores. */
function listaAnciaos(){
  const mapa=new Map();
  const base=nome=>({nome:nome,tipo:'anciao',login:false,perfil:'',id:'',telefone:'',origem:'',obs:''});
  S.usuarios.forEach(u=>mapa.set(nrm(u.nome),Object.assign(base(u.nome),{login:true,perfil:u.perfil})));
  if(S.usuario&&!mapa.has(nrm(S.usuario)))mapa.set(nrm(S.usuario),Object.assign(base(S.usuario),{login:true,perfil:S.perfil}));
  S.pessoas.filter(p=>p.tipo==='anciao').forEach(p=>{
    const k=nrm(p.nome),b=mapa.get(k)||base(p.nome);
    mapa.set(k,Object.assign({},b,{id:p.id,telefone:p.telefone||'',origem:p.origem||'',obs:p.obs||''}));
  });
  return Array.from(mapa.values()).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
function listaConvidados(){return S.pessoas.filter(p=>p.tipo==='convidado').sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));}
function nomesPessoas(){return listaAnciaos().map(a=>a.nome).concat(listaConvidados().map(c=>c.nome));}
function buscaPessoa(nome){
  const k=chavePessoa(nome);if(!k)return null;
  return listaAnciaos().concat(listaConvidados()).find(p=>chavePessoa(p.nome)===k)||null;
}
function datalist(id,nomes){return h('datalist',{id:id},nomes.map(n=>h('option',{value:n})));}
const soDig = s => String(s||'').replace(/\D/g,'');
function linkWA(tel){let d=soDig(tel);if(!d)return '';if(d.length<=11)d='55'+d;return 'https://wa.me/'+d;}
function linkTel(tel){let d=soDig(tel);if(!d)return '';if(d.length<=11)d='55'+d;return 'tel:+'+d;}
function linksTel(tel){
  return h('span',{class:'tel'},tel,h('a',{href:linkTel(tel)},'Ligar'),h('a',{href:linkWA(tel),target:'_blank',rel:'noopener'},'WhatsApp'));
}
async function salvarCfg(chave,valor){
  if(!pode()){toast('Seu acesso é somente de leitura.');return false;}
  try{await api('config',{chave:chave,valor:valor});return true;}
  catch(e){toast('Não foi possível salvar: '+e.message);return false;}
}

    area.replaceChildren();

    const promove=S.deptos.filter(d=>mesmo(d.responsavel,nome)).map(d=>d.nome);
    const apoia=S.deptos.filter(d=>d.apoio.some(n=>mesmo(n,nome))).map(d=>d.nome);
    const semanas=[],ini=inicioSemana(hoje);
    for(let i=0;i<26&&semanas.length<6;i++){const a=somaDias(ini,i*7);if(mesmo(anciaoDaSemana(a),nome)||casa(anciaoDaSemana(a),nome))semanas.push(a);}
    const papel=e=>[casa(e.dirigente,nome)&&'Ancião responsável',casa(e.pessoa,nome)&&tipoDe(e).pessoa,
      promove.indexOf(e.depto)>=0&&('Promove '+e.depto),apoia.indexOf(e.depto)>=0&&('Apoia '+e.depto)].filter(Boolean).join(' · ');
    const linha=e=>h('div',{class:'ln'},h('b',null,fmtCurto(e.data)),h('span',null,(e.titulo||tipoDe(e).nome)+' ('+papel(e)+')'));
    const meus=S.eventos.filter(e=>casa(e.pessoa,nome)||casa(e.dirigente,nome)||(e.depto&&(promove.indexOf(e.depto)>=0||apoia.indexOf(e.depto)>=0))).sort(ordemEv);
    const prox=meus.filter(e=>e.data>=hoje).slice(0,12),pass=meus.filter(e=>e.data<hoje).slice(-5).reverse();
    const tarefas=S.tarefas.filter(t=>!t.feito&&(mesmo(t.resp,nome)||(t.depto&&(promove.indexOf(t.depto)>=0||apoia.indexOf(t.depto)>=0)))).sort((a,b)=>(a.prazo||'9999').localeCompare(b.prazo||'9999'));
    const visitas=S.eventos.filter(e=>e.tipo==='visita'&&e.status==='feito'&&doMes(e)&&casa(e.pessoa,nome)).length;
    const poe=(...ks)=>ks.forEach(k=>{if(k!=null&&k!==false)area.append(k);});

      h('p',{class:'sec-t'},'Departamentos'),
      (promove.length||apoia.length)?h('div',{class:'lst'},
        promove.length?h('div',{class:'ln'},h('b',null,'Promove'),h('span',null,promove.join(', '))):null,
        apoia.length?h('div',{class:'ln'},h('b',null,'Apoia'),h('span',null,apoia.join(', '))):null)

      h('p',{class:'sec-t'},'Semanas como ancião da semana'),
      semanas.length?h('div',{class:'lst'},semanas.map(a=>h('div',{class:'ln'},h('b',null,fmtDM(a)+' a '+fmtDM(somaDias(a,6))),h('span',null,a===ini?'esta semana':'')))):h('p',{class:'muted'},Object.keys(S.rodizio.semanas||{}).length?'Nenhuma nas próximas semanas.':'Nenhuma semana designada.'),
      h('p',{class:'sec-t'},'Próximos compromissos'),
      prox.length?h('div',{class:'lst'},prox.map(linha)):h('p',{class:'muted'},'Nada marcado em seu nome ou nos seus departamentos.'),
      h('p',{class:'sec-t'},'Tarefas em aberto'),
      tarefas.length?h('div',{class:'lst'},tarefas.slice(0,10).map(t=>h('div',{class:'ln'},h('b',null,t.prazo?fmtDM(t.prazo):'sem prazo'),h('span',{class:t.prazo&&t.prazo<hoje?'late':''},t.titulo+(t.depto?' ('+t.depto+')':''))))):h('p',{class:'muted'},'Nenhuma tarefa em aberto.'),

/* ---------- Anciãos e pregadores convidados (com telefone) ---------- */
function abrirPessoas(aba){
  aba=aba||'anciao';
  const corpo=h('div',{class:'form'});
  function contato(p){return p.telefone?h('span',{class:'muted tel'},linksTel(p.telefone)):h('span',{class:'muted'},'Sem telefone cadastrado');}
  function desenha(){
    corpo.replaceChildren(
      h('div',{class:'tabs',role:'tablist'},
        h('button',{type:'button',role:'tab','aria-selected':aba==='anciao'?'true':'false',onclick:()=>{aba='anciao';desenha();}},'Anciãos'),
        h('button',{type:'button',role:'tab','aria-selected':aba==='convidado'?'true':'false',onclick:()=>{aba='convidado';desenha();}},'Pregadores convidados')),
      aba==='anciao'?painelAnciaos():painelConvidados());
  }
  function painelAnciaos(){
    const box=h('div',{class:'lst'});
    const todos=listaAnciaos();
    todos.forEach(a=>{
      const promove=S.deptos.filter(d=>mesmo(d.responsavel,a.nome)).map(d=>d.nome);
      const apoia=S.deptos.filter(d=>d.apoio.some(n=>mesmo(n,a.nome))).map(d=>d.nome);
      box.append(h('div',{class:'row2'},
        h('div',{class:'top'},h('b',null,a.nome),a.login?h('span',{class:'tag'},a.perfil==='leitor'?'Login · leitor':'Login'):null,
          h('button',{class:'btn sm so-editor',type:'button',onclick:()=>formPessoa(a)},'Editar')),
        contato(a),
        promove.length?h('span',{class:'muted'},'Promove: '+promove.join(', ')):null,
        apoia.length?h('span',{class:'muted'},'Apoia: '+apoia.join(', ')):null,
        a.obs?h('span',{class:'muted'},a.obs):null));
    });
    if(!todos.length)box.append(h('p',{class:'vazio'},'Nenhum ancião ainda.'));
    return h('div',{class:'form'},
      h('p',{class:'muted'},'Quem tem login aparece aqui automaticamente. Para um ancião que ainda não tem login, use Adicionar.'),
      box,
      h('div',{class:'acoes'},h('button',{class:'btn so-editor',type:'button',onclick:()=>formPessoa({tipo:'anciao'})},icone('plus',16),'Adicionar ancião'),
        h('button',{class:'btn',type:'button',onclick:fechar},'Fechar')));
  }
  function painelConvidados(){
    const box=h('div',{class:'lst'});
    const todos=listaConvidados();
    todos.forEach(c=>box.append(h('div',{class:'row2'},
      h('div',{class:'top'},h('b',null,c.nome),h('button',{class:'btn sm so-editor',type:'button',onclick:()=>formPessoa(c)},'Editar')),
      contato(c),c.origem?h('span',{class:'muted'},c.origem):null,c.obs?h('span',{class:'muted'},c.obs):null)));
    if(!todos.length)box.append(h('p',{class:'vazio'},'Nenhum pregador convidado cadastrado.'));
    return h('div',{class:'form'},
      h('p',{class:'muted'},'Pregadores de fora da igreja. Os nomes aparecem como sugestão ao marcar uma pregação, e o telefone fica à mão para confirmar o convite.'),
      box,
      h('div',{class:'acoes'},h('button',{class:'btn primary so-editor',type:'button',onclick:()=>formPessoa({tipo:'convidado'})},icone('plus',16),'Cadastrar pregador convidado'),
        h('button',{class:'btn',type:'button',onclick:fechar},'Fechar')));
  }
  function formPessoa(base){
    if(!pode()){toast('Seu acesso é somente de leitura.');return;}
    const conv=base.tipo==='convidado';
    const inNome=h('input',{type:'text',id:'p-nome',maxlength:'80',autocomplete:'off',required:true,value:base.nome||'',disabled:!!base.login});
    const inTel=h('input',{type:'tel',id:'p-tel',maxlength:'25',autocomplete:'off',placeholder:'(69) 9 0000-0000',value:base.telefone||''});
    const inOri=h('input',{type:'text',id:'p-ori',maxlength:'100',autocomplete:'off',value:base.origem||'',placeholder:'Igreja, distrito ou cidade'});
    const inObs=h('textarea',{id:'p-obs',maxlength:'300',value:base.obs||'',style:'min-height:60px'});
    const salvarBtn=h('button',{class:'btn primary',type:'submit'},'Salvar');
    const acoes=h('div',{class:'acoes'},salvarBtn,h('button',{class:'btn',type:'button',onclick:()=>abrirPessoas(base.tipo)},'Voltar'));
    if(base.id&&!base.login){
      let armado=false;
      const bd=h('button',{class:'btn danger',type:'button'},'Excluir');
      bd.addEventListener('click',async()=>{
        if(!armado){armado=true;bd.textContent='Confirmar exclusão';setTimeout(()=>{armado=false;bd.textContent='Excluir';},4000);return;}
        if(await excluir('pessoas',base.id)){toast('Cadastro excluído');abrirPessoas(base.tipo);}
      });
      acoes.append(bd);
    }
    const f=h('form',{class:'form'},
      h('div',null,h('label',{for:'p-nome'},base.login?'Nome (vem do login)':'Nome'),inNome),
      h('div',null,h('label',{for:'p-tel'},'Telefone ou WhatsApp'),inTel),
      conv?h('div',null,h('label',{for:'p-ori'},'Igreja ou distrito de origem'),inOri):null,
      h('div',null,h('label',{for:'p-obs'},conv?'Observações (temas, disponibilidade)':'Observações'),inObs),acoes);
    f.addEventListener('submit',async e=>{
      e.preventDefault();
      const nome=(base.login?base.nome:inNome.value).trim();
      if(!nome){toast('Escreva o nome.');return;}
      const igual=S.pessoas.some(p=>p.id!==base.id&&p.tipo===base.tipo&&mesmo(p.nome,nome))||(!base.id&&!base.login&&base.tipo==='anciao'&&listaAnciaos().some(a=>mesmo(a.nome,nome)));
      if(igual){toast('Já existe um cadastro com esse nome.');return;}
      salvarBtn.disabled=true;
      if(await salvar('pessoas',[{id:base.id||novoId(),nome:nome,tipo:base.tipo,telefone:inTel.value.trim(),origem:conv?inOri.value.trim():'',obs:inObs.value.trim()}])){
        toast('Cadastro salvo');abrirPessoas(base.tipo);
      }else salvarBtn.disabled=false;
    });
    abrir(conv?(base.id?'Editar pregador convidado':'Novo pregador convidado'):(base.id||base.login?'Editar ancião':'Novo ancião'),f);
  }
  desenha();
  abrir('Anciãos e pregadores',corpo);
}

/* ---------- Liturgias ---------- */
const copia = o => JSON.parse(JSON.stringify(o));
/* Modelo da igreja: o que foi salvo em "Salvar como modelo" ou, se não houver, o modelo original. */
function litModelo(tipo){
  const base=copia(LIT_MODELOS[tipo]),o=S.liturgias&&S.liturgias[tipo];
  base.proprio=false;
  if(o&&!Array.isArray(o)&&Array.isArray(o.secoes)){
    base.titulo=o.titulo||base.titulo;base.hora=o.hora||base.hora;base.obs=o.obs||'';
    base.secoes=o.secoes.map(s=>({t:s.t||'',col:s.col||'Detalhes',q:!!s.q,
      l:(s.l||[]).map(a=>({m:a[0]||'',h:a[1]||'',d:a[2]||'',r:a[3]||'',a:a[4]||''}))}));
    base.proprio=true;
  }
  return base;
}
function litCompacta(L){
  return {titulo:L.titulo,hora:L.hora,obs:L.obs||'',
    secoes:L.secoes.map(s=>({t:s.t,col:s.col,q:s.q?1:0,l:s.l.map(l=>[l.m,l.h,l.d,l.r,l.a])}))};
}
function proximaDataLit(tipo){
  const d=parse(hojeIso());
  while(d.getDay()!==LIT_MODELOS[tipo].dia)d.setDate(d.getDate()+1);
  return isoOf(d);
}
/* Liturgias salvas no servidor: cada culto (tipo + data) tem a parte do ancionato ("dados") e a parte da música ("musica"). */
const litKey = (tipo,data) => tipo+'|'+data;
/* Linha só do ancionato: a página da música não vê o que está escrito nela. */
const ehAncionato = l => {const r=String(l.r||'').trim();return !!r&&r.split('/').every(p=>/ancionato/i.test(p));};
function litChaves(L){const c={};L.secoes.forEach(s=>s.l.forEach(l=>{const b=l.m+'|'+l.h;c[b]=(c[b]||0)+1;l.k=c[b]>1?b+'#'+c[b]:b;}));}
function litDadosServidor(L){const c=litCompacta(L);c.turno=L.turno.slice();return c;}
/* Monta a liturgia de um culto: o que está salvo (ancionato + música) ou, se ainda não há nada, o modelo da igreja. */
function litMontar(tipo,data){
  const rec=S.lits[litKey(tipo,data)];
  let L;
  if(rec&&rec.dados&&Array.isArray(rec.dados.secoes)){
    const d=rec.dados;L=litModelo(tipo);
    L.titulo=d.titulo||L.titulo;L.hora=d.hora||L.hora;L.obs=d.obs||'';
    L.secoes=d.secoes.map(s=>({t:s.t||'',col:s.col||'Detalhes',q:!!s.q,l:(s.l||[]).map(a=>({m:a[0]||'',h:a[1]||'',d:a[2]||'',r:a[3]||'',a:a[4]||''}))}));
    L.turno=['','','',''].map((_,i)=>(d.turno&&d.turno[i])||'');
  }else L=novaLiturgia(tipo,data);
  L.proprio=litModelo(tipo).proprio;
  litChaves(L);
  const mu=(rec&&rec.musica)||{v:'',m:{}};
  L.vocal=mu.v||'';
  L.secoes.forEach(s=>s.l.forEach(l=>{l.x=(mu.m&&mu.m[l.k])||'';}));
  return L;
}
/* Para PDF e WhatsApp: o que o ancionato e a música escreveram no mesmo momento aparece junto. */
function litSaida(L){const c=copia(L);c.secoes.forEach(s=>s.l.forEach(l=>{l.d=[l.d,l.x].filter(Boolean).join(' - ');}));return c;}
const urlMusica = chave => new URL('musica.html',location.href).href.split('#')[0].split('?')[0]+'#k='+chave;
function fmtQuando(iso){const d=new Date(iso);return isNaN(d)?'':pad(d.getDate())+'/'+pad(d.getMonth()+1)+' às '+pad(d.getHours())+':'+pad(d.getMinutes());}
let litAtual=null;
function novaLiturgia(tipo,data){
  const L=litModelo(tipo),aw=anciaoDaSemana(data),pre=pregadorDo(data);
  L.turno=['','','',''];if(aw)L.turno[0]=aw;
  L.vocal='';
  /* O pregador da agenda entra sozinho no Sermão e na oração final (menos na Quarta Kids). */
  if(pre&&pre.pessoa&&tipo!=='kids')L.secoes.forEach(s=>s.l.forEach(l=>{if(!l.d&&/^(serm[aã]o|ora[cç][aã]o final)/i.test(l.m))l.d=pre.pessoa;}));
  return L;
}
const dataLit = iso => {const d=parse(iso);return {dia:pad(d.getDate()),mes:MESES[d.getMonth()],ano:String(d.getFullYear())};};
function nomesVocal(txt){return String(txt||'').split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean);}
function linhasVocal(nomes){
  if(!nomes.length)return [];
  const n=Math.ceil(nomes.length/5),por=Math.ceil(nomes.length/n),o=[];
  for(let i=0;i<nomes.length;i+=por)o.push(nomes.slice(i,i+por));
  return o;
}
function textoLit(L,data){
  const d=parse(data),o=['*'+L.titulo+' - '+DIAS_L[d.getDay()]+', '+fmtBR(data)+' - '+L.hora+'*'];
  const t=L.turno.map(s=>s.trim()).filter(Boolean);
  if(t.length)o.push('Ancionato de turno: '+t.join(', '));
  const v=nomesVocal(L.vocal);if(v.length)o.push('Vocal: '+v.join(', '));
  L.secoes.forEach(s=>{
    o.push('');if(s.t)o.push('*'+s.t+'*');
    s.l.forEach(l=>o.push(l.h+' - '+l.m+(l.d?': '+l.d:'')+(l.a?' ('+l.a+')':'')+(l.r?' ['+l.r+']':'')));
  });
  if(L.obs&&L.obs.trim())o.push('','_'+L.obs.trim()+'_');
  return o.join('\n');

/* PDF no formato dos impressos: A4 em pé, fundo colorido, faixas alternadas, logo da igreja. */
async function pdfLiturgia(L,tipo,data){
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){toast('O gerador de PDF não carregou. Verifique a internet e recarregue a página.');return;}
  const doc=new J({orientation:'portrait',unit:'mm',format:'a4'});
  if(!doc.autoTable){toast('O gerador de tabelas do PDF não carregou. Recarregue a página.');return;}
  const T=LIT_TEMAS[LIT_MODELOS[tipo].tema],NAVY=[31,56,100];
  const logo=LOGO_IGREJA,emb=LOGO_ADS;
  const feitas=new Set();
  const pagAtual=()=>doc.internal.getCurrentPageInfo().pageNumber;
  const fundo=()=>{
    doc.setFillColor(T.bg[0],T.bg[1],T.bg[2]);doc.rect(0,0,210,297,'F');
    if(logo)doc.addImage(logo,'PNG',163.7,0,46.3,33.9);
    if(emb)doc.addImage(emb,'PNG',192,279,18,18);
    feitas.add(pagAtual());
  };
  fundo();
  doc.setFont('helvetica','bold');doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);
  doc.setFontSize(27);doc.text(L.titulo,14,23);
  const tw=doc.getTextWidth(L.titulo);
  doc.setFontSize(15);doc.text(L.hora,14+tw/2,33,{align:'center'});
  /* caixa com título, faixa e linhas finas (Ancionato de Turno, Data, Vocal) */
  const encaixa=(txt,larg,max)=>{let s=max;doc.setFontSize(s);while(doc.getTextWidth(txt)>larg&&s>6){s-=.5;doc.setFontSize(s);}};
  const caixa=(x,w,y,tit,linhas)=>{
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);
    doc.text(tit,x+w/2,y+4.2,{align:'center'});
    doc.setDrawColor(T.linha[0],T.linha[1],T.linha[2]);doc.setLineWidth(.3);
    doc.line(x,y,x+w,y);doc.line(x,y+6,x+w,y+6);
    let yy=y+6;
    linhas.forEach((vals,i)=>{
      if(i%2===0){doc.setFillColor(T.faixa[0],T.faixa[1],T.faixa[2]);doc.rect(x,yy,w,7,'F');}
      doc.setFont('helvetica','normal');doc.setTextColor(0,0,0);
      const cw=w/vals.length;
      vals.forEach((v,k)=>{encaixa(v,cw-2,10.5);doc.text(v,x+cw*(k+.5),yy+4.9,{align:'center'});});
      yy+=7;
    });
    doc.setDrawColor(T.linha[0],T.linha[1],T.linha[2]);doc.line(x,yy,x+w,yy);
    return yy;
  };
  const turno=L.turno.map(s=>s.trim());
  const dt=dataLit(data);
  let y=45;
  caixa(14,110,y,'Ancionato de Turno',[turno.some(Boolean)?turno:['','','','']]);
  caixa(132,64,y,'Data',[[dt.dia,dt.mes,dt.ano]]);
  y=64;
  const vl=linhasVocal(nomesVocal(L.vocal));
  if(vl.length){y=caixa(50,110,y,'Vocal',vl.map(r=>[r.join('   ')]))+7;}else y=62;
  L.secoes.forEach((s,si)=>{
    if(s.q&&si>0){doc.addPage();fundo();y=40;}
    if(s.t){
      doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);
      doc.text(s.t,105,y+8,{align:'center'});y+=12;
    }
    doc.autoTable({
      startY:y,margin:{left:18,right:19,top:14,bottom:14},theme:'plain',
      head:[['Momento','Horário',s.col||'Detalhes','Responsável']],
      body:s.l.map(l=>[l.m,l.h,l.d,(l.r||'').replace(/\s*\/\s*/g,'\n')]),
      styles:{font:'helvetica',fontSize:9,cellPadding:{top:1.7,bottom:1.7,left:2,right:2},textColor:[0,0,0],valign:'middle',lineWidth:0,overflow:'linebreak'},
      headStyles:{fontStyle:'bold',fontSize:9,textColor:NAVY,halign:'center',fillColor:false,lineWidth:{bottom:.3},lineColor:T.linha},
      columnStyles:{0:{cellWidth:48,halign:'left'},1:{cellWidth:18,halign:'center'},2:{halign:'center',fontSize:10},3:{cellWidth:30,halign:'right'}},
      didParseCell:d=>{
        if(d.section!=='body')return;
        if(d.row.index%2===0)d.cell.styles.fillColor=T.faixa;
        const l=s.l[d.row.index];
        if(d.column.index===2&&l&&l.a){   // linha de destaque em vermelho: desenhada à mão
          const larg=d.cell.styles.cellWidth&&typeof d.cell.styles.cellWidth==='number'?d.cell.styles.cellWidth:70;
          const n=(l.d?doc.splitTextToSize(l.d,larg-4).length:0)+1;
          d.cell.styles.minCellHeight=n*4.3+3.4;d.cell.text=[''];
        }
      },
      didDrawCell:d=>{
        if(d.section!=='body'||d.column.index!==2)return;
        const l=s.l[d.row.index];if(!l||!l.a)return;
        const lin=l.d?doc.splitTextToSize(l.d,d.cell.width-4):[];
        const tot=lin.length+1,lh=4.3,y0=d.cell.y+d.cell.height/2-tot*lh/2+lh*.78;
        doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(0,0,0);
        lin.forEach((t,i)=>doc.text(t,d.cell.x+d.cell.width/2,y0+i*lh,{align:'center'}));
        doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,0,0);
        doc.text(l.a,d.cell.x+d.cell.width/2,y0+lin.length*lh,{align:'center'});
        doc.setTextColor(0,0,0);
      },
      willDrawPage:()=>{if(!feitas.has(pagAtual()))fundo();}
    });
    y=doc.lastAutoTable.finalY+8;
  });
  if(L.obs&&L.obs.trim()){
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);
    const lin=doc.splitTextToSize(L.obs.trim(),150);
    if(y+8+lin.length*4.5>285){doc.addPage();fundo();y=40;}
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);
    doc.text('OBSERVAÇÕES',105,y+6,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(0,0,0);
    lin.forEach((t,i)=>doc.text(t,105,y+12+i*4.6,{align:'center'}));
  }
  doc.save('liturgia-'+tipo+'-'+data+'.pdf');
}

function abrirLiturgias(tipo,dataIni){
  tipo=LIT_TIPOS[tipo]?tipo:'sabado';
  let data=dataIni||proximaDataLit(tipo),L=null,estrutura=false,uid=0,mostrarLink=false,linkTxt='';
  const ro=!pode();
  let tA=null,tM=null,pendM={},pendV=null,sujoA=false,primeiraSync=true;
  const camposMus=new Map();let campoVocal=null;
  const corpo=h('div',{class:'form'});
  const stEl=h('span',{class:'muted',role:'status','aria-live':'polite'});
  const infoMus=h('p',{class:'muted'});
  const setSt=t=>{stEl.textContent=t;};
  function carrega(){L=litMontar(tipo,data);pendM={};pendV=null;sujoA=false;}
  function recAtual(){const k=litKey(tipo,data);return S.lits[k]||(S.lits[k]={id:tipo+'_'+data,tipo:tipo,data:data,dados:null,musica:{v:'',m:{}}});}
  async function enviar(action,dados){
    try{const r=await api(action,dados);setSt(r&&r.offline?'Sem internet: salvo no aparelho, será enviado depois':'Salvo');}
    catch(e){setSt('Não foi possível salvar');toast('Não foi possível salvar a liturgia: '+e.message);}
  }
  function enviaAnc(){
    clearTimeout(tA);tA=null;if(!sujoA||ro)return;sujoA=false;
    const dados=litDadosServidor(L);recAtual().dados=dados;cacheLocal();
    setSt('Salvando…');enviar('litSalvar',{tipo:tipo,data:data,dados:dados});
  }
  function enviaMus(){
    clearTimeout(tM);tM=null;if(ro)return;
    const m=pendM,delta={m:m};if(pendV!==null)delta.v=pendV;
    if(!Object.keys(m).length&&pendV===null)return;
    pendM={};pendV=null;
    const rec=recAtual();rec.musica=rec.musica||{v:'',m:{}};
    if(delta.v!==undefined)rec.musica.v=delta.v;
    Object.keys(m).forEach(k=>{if(m[k])rec.musica.m[k]=m[k];else delete rec.musica.m[k];});
    cacheLocal();setSt('Salvando…');enviar('litMusica',{tipo:tipo,data:data,delta:delta});
  }
  const flush=()=>{enviaAnc();enviaMus();};
  const guarda=()=>{if(ro)return;sujoA=true;setSt('Salvando…');clearTimeout(tA);tA=setTimeout(enviaAnc,800);};
  const guardaMus=(k,v)=>{if(ro)return;pendM[k]=v;setSt('Salvando…');clearTimeout(tM);tM=setTimeout(enviaMus,800);};
  const guardaVocal=v=>{if(ro)return;pendV=v;setSt('Salvando…');clearTimeout(tM);tM=setTimeout(enviaMus,800);};

  function textoInfoMus(){
    const rec=S.lits[litKey(tipo,data)];
    infoMus.textContent=rec&&rec.musicaEm?'Música: último preenchimento por '+(rec.musicaPor||'—')+', em '+fmtQuando(rec.musicaEm)+'.':'A música ainda não preencheu este culto.';
  }
  /* Traz o que a música preencheu sem apagar o que está sendo digitado agora. */
  function aplicaMusica(){
    const rec=S.lits[litKey(tipo,data)],mu=(rec&&rec.musica)||{v:'',m:{}};
    if(campoVocal&&pendV===null&&document.activeElement!==campoVocal){L.vocal=mu.v||'';if(campoVocal.value!==L.vocal)campoVocal.value=L.vocal;}
    L.secoes.forEach(s=>s.l.forEach(l=>{
      const el=camposMus.get(l.k);if(!el||(l.k in pendM)||document.activeElement===el)return;
      const v=(mu.m&&mu.m[l.k])||'';l.x=v;if(el.value!==v)el.value=v;
    }));
    textoInfoMus();
  }
  async function sincroniza(){
    if(lerFila().length||sujoA||tA||tM)return;
    try{
      const r=await api('litListar');
      S.lits={};(r.liturgias||[]).forEach(x=>{if(x&&x.tipo&&x.data)S.lits[litKey(x.tipo,x.data)]=x;});
      cacheLocal();
      if(sujoA||tA||tM)return;
      if(primeiraSync){primeiraSync=false;carrega();desenha();}else aplicaMusica();
    }catch(_){}

/* ---------- Histórico de pregadores ---------- */
function abrirHistorico(){
  const todos=S.eventos.filter(e=>e.tipo==='pregacao'&&e.pessoa);
  if(!todos.length){abrir('Histórico de pregadores',h('p',{class:'vazio'},'Ainda não há pregações com pregador definido.'));return;}
  const anos=Array.from(new Set(todos.map(e=>e.data.slice(0,4)))).sort().reverse();
  const anoAtual=String(new Date().getFullYear());
  const selAno=h('select',{id:'hi-ano','aria-label':'Ano',value:anos.indexOf(anoAtual)>=0?anoAtual:anos[0]},anos.map(a=>h('option',{value:a},a)));
  const busca=h('input',{type:'search',id:'hi-busca',placeholder:'Buscar pregador ou tema','aria-label':'Buscar pregador ou tema'});
  const area=h('div',{class:'form'});
  let linhasPdf=[];
  function desenha(){
    area.replaceChildren();
    const q=nrm(busca.value);
    const lista=todos.filter(e=>e.data.slice(0,4)===selAno.value&&(!q||nrm(e.pessoa+' '+e.detalhe+' '+e.titulo).indexOf(q)>=0)).sort(ordemEv).reverse();
    const cont={};lista.forEach(e=>{const k=e.pessoa.trim();cont[k]=(cont[k]||0)+1;});
    const rank=Object.keys(cont).sort((a,b)=>cont[b]-cont[a]||a.localeCompare(b,'pt-BR')).slice(0,8);
    linhasPdf=lista.slice().reverse().map(e=>[fmtBR(e.data),e.pessoa,e.detalhe||'',anciaoDaSemana(e.data)||'',ROT_ST[e.status]||'']);
    area.append(h('p',{class:'sec-t'},'Quem mais pregou'),
      rank.length?h('div',{class:'ranks'},rank.map(k=>h('span',{class:'tag'},k+' · '+cont[k]))):h('p',{class:'muted'},'Nada encontrado.'),
      h('p',{class:'sec-t'},lista.length+(lista.length===1?' pregação':' pregações')),
      h('div',{class:'lst'},lista.map(e=>h('div',{class:'ln'},h('b',null,fmtDM(e.data)),h('span',null,e.pessoa+(e.detalhe?' · '+e.detalhe:'')+(e.status==='a_confirmar'?' (a confirmar)':''))))));
  }
  selAno.addEventListener('change',desenha);busca.addEventListener('input',desenha);desenha();
  abrir('Histórico de pregadores',h('div',{class:'form'},
    h('div',{class:'g2'},h('div',null,h('label',{for:'hi-ano'},'Ano'),selAno),h('div',null,h('label',{for:'hi-busca'},'Buscar'),busca)),
    area,
    h('div',{class:'acoes'},
      h('button',{class:'btn primary',type:'button',onclick:()=>gerarPDF('Histórico de pregações',selAno.value,['Data','Pregador(a)','Tema ou anotação','Ancião da semana','Situação'],linhasPdf,'historico-pregacoes-'+selAno.value+'.pdf')},icone('file',15),'Baixar PDF'),
      h('button',{class:'btn',type:'button',onclick:fechar},'Fechar'))));
}

/* ---------- PDF ---------- */
function gerarPDF(titulo,sub,cols,linhas,arquivo){
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){toast('O gerador de PDF não carregou. Verifique a internet e recarregue a página.');return;}
  if(!linhas.length){toast('Não há dados para o PDF.');return;}
  const doc=new J({orientation:'landscape',unit:'mm',format:'a4'});
  if(!doc.autoTable){toast('O gerador de tabelas do PDF não carregou. Recarregue a página.');return;}
  doc.setFontSize(16);doc.text(titulo,14,16);
  doc.setFontSize(10);doc.setTextColor(100);doc.text(sub+'  ·  '+CONFIG.TITULO+'  ·  gerado em '+fmtBR(hojeIso()),14,22);
  doc.autoTable({head:[cols],body:linhas,startY:27,styles:{fontSize:9,cellPadding:2},headStyles:{fillColor:[27,58,92]},margin:{left:14,right:14}});
  doc.save(arquivo);
}
function pdfMes(){
  const ano=S.mes.getFullYear(),m=S.mes.getMonth();
  const lista=S.eventos.filter(doMes).sort(ordemEv);
  if(!lista.length){toast('Nenhum evento em '+MESES[m]+'.');return;}
  gerarPDF('Agenda de '+MESES[m]+' '+ano,'Eventos do mês',
    ['Data','Dia','Hora','Tipo','Título','Responsável','Ancião responsável','Ancião da semana','Situação'],
    lista.map(e=>[fmtBR(e.data),DIAS_C[parse(e.data).getDay()],e.hora||'',tipoDe(e).nome,e.titulo||'',e.pessoa||'',e.dirigente||'',anciaoDaSemana(e.data)||'',ROT_ST[e.status]||'']),
    'agenda-'+ano+'-'+pad(m+1)+'.pdf');
}

/* ---------- Alertas ---------- */
function calcAlertas(){
  const out=[],hoje=hojeIso(),lim2=somaDias(hoje,2),lim21=somaDias(hoje,21);
  const sem=inicioSemana(hoje),aw=anciaoDaSemana(hoje);
  if(aw){
    out.push({nivel:'info',txt:'Ancião da semana: '+aw+' (até sex '+fmtDM(somaDias(sem,6))+').'});
    const prox=anciaoDaSemana(somaDias(sem,7));
    if(prox&&prox!==aw)out.push({nivel:'info',txt:'A partir de sáb '+fmtDM(somaDias(sem,7))+': '+prox+'.'});
  }
  S.eventos.filter(e=>e.data>=hoje&&e.data<=lim2).sort(ordemEv).forEach(e=>{
    out.push({nivel:'info',txt:(e.data===hoje?'Hoje':e.data===somaDias(hoje,1)?'Amanhã':fmtCurto(e.data))+': '+(e.titulo||tipoDe(e).nome)+(e.hora?' às '+e.hora:'')+'.'});
  });
  /* pregador ainda não confirmado (qualquer dia de culto) */
  S.eventos.filter(e=>(e.tipo==='pregacao'||e.tipo==='santa_ceia')&&e.status==='a_confirmar'&&e.data>=hoje&&e.data<=lim21).sort(ordemEv).forEach(e=>{
    out.push({nivel:'warn',txt:'Confirmar o culto de '+fmtCurto(e.data)+(e.pessoa?' com '+e.pessoa:'')+'.'});
  });
  /* culto sem pregador: sábado, domingo e quarta-feira das próximas 3 semanas */
  diasDeCulto(hoje,21).forEach(s=>{
    if(!pregadorDo(s))out.push({nivel:'warn',txt:'Culto de '+CULTOS_DIA[parse(s).getDay()]+' ('+fmtDM(s)+') sem pregador definido.'});
  });
  S.tarefas.filter(t=>!t.feito&&t.prazo).sort((a,b)=>a.prazo.localeCompare(b.prazo)).forEach(t=>{
    if(t.prazo<hoje)out.push({nivel:'bad',txt:'Tarefa vencida em '+fmtDM(t.prazo)+': '+t.titulo+(t.resp?' ('+t.resp+')':'')+'.'});
    else if(t.prazo<=somaDias(hoje,3))out.push({nivel:'warn',txt:'Tarefa vence em '+fmtDM(t.prazo)+': '+t.titulo+(t.resp?' ('+t.resp+')':'')+'.'});
  });
  const semResp=S.deptos.filter(d=>!d.responsavel).length;
  if(semResp)out.push({nivel:'info',txt:semResp+(semResp>1?' departamentos estão':' departamento está')+' sem ancião responsável.'});
  return out;
}
function updateSino(){
  const b=$('#b-sino');if(!b)return;
  const n=calcAlertas().filter(a=>a.nivel!=='info').length;
  const ant=b.querySelector('.n');if(ant)ant.remove();
  if(n)b.append(h('span',{class:'n'},String(n)));
  b.setAttribute('aria-label','Alertas'+(n?' ('+n+')':''));
}
function abrirAlertas(){
  const lista=calcAlertas();
  const corpo=h('div',{class:'form'});
  if(!lista.length)corpo.append(h('p',{class:'vazio'},'Nenhum alerta. Tudo em dia.'));
  lista.forEach(a=>corpo.append(h('div',{class:'al '+a.nivel},h('i'),h('span',null,a.txt))));
  corpo.append(h('div',{class:'acoes'},h('button',{class:'btn',type:'button',onclick:fechar},'Fechar')));
  abrir('Alertas',corpo);
}

  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInst=e;mostrarInst();});
  window.addEventListener('appinstalled',()=>{promptInst=null;mostrarInst();toast('App instalado.');});
  document.querySelectorAll('.js-inst').forEach(b=>b.addEventListener('click',()=>{
    if(promptInst){promptInst.prompt();promptInst.userChoice.then(()=>{promptInst=null;mostrarInst();});return;}
    abrir('Instalar no iPhone ou iPad',h('div',{class:'form keep'},
      h('p',null,'No Safari, toque no botão Compartilhar (quadrado com seta para cima), role a lista e escolha Adicionar à Tela de Início.'),
      h('p',{class:'muted'},'Depois de instalado, o app abre em tela cheia e funciona sem internet.'),
      h('div',{class:'acoes'},h('button',{class:'btn',type:'button',onclick:fechar},'Entendi'))));
  }));
  mostrarInst();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    const tinha=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(tinha)toast('Nova versão instalada. Feche e abra o app para usar.');});
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.token&&!$('#app').hidden)carregar(true);});
  $('#f-login').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=$('#lg-btn'),er=$('#lg-erro');er.hidden=true;btn.disabled=true;btn.textContent='Entrando…';
    try{
      const r=await api('login',{nome:$('#lg-nome').value.trim(),senha:$('#lg-senha').value});
      S.token=r.token;S.usuario=r.usuario;S.perfil=r.perfil||'editor';guardarSessao($('#lg-manter').checked);
      $('#lg-senha').value='';entrar();
    }catch(err){er.textContent=err.message;er.hidden=false;}
    finally{btn.disabled=false;btn.textContent='Entrar';}
  });
  const s=lerSessao();
  if(s){S.token=s.token;S.usuario=s.usuario;S.perfil=s.perfil||'editor';entrar();}else mostrarLogin('');
}
iniciar();
})();
</script>
</body>
</html>
